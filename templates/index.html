<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pannello di controllo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <header>
        <h1>Pannello di controllo</h1>
        <div id="statusBar">Batteria <strong id="batteryValue">–</strong>% · <strong id="flightState">a terra</strong> ·
            <span id="statusMessage"></span></div>
    </header>

    <main>
        <div class="video-panel"><img src="{{ url_for('videoFeed') }}" alt="Video in diretta dal Tello"></div>

        <section class="controls-panel">
            <div>
                <h2>Decollo e atterraggio</h2>
                <div class="takeoff-land-group">
                    <button id="takeoffButton">Decolla</button>
                    <button id="landButton">Atterra</button>
                </div>
            </div>

            <div>
                <h2>Spostamento</h2>

                <div class="movement-pad">
                    <span class="pad-spacer"></span>
                    <button data-axis="forwardBack" data-direction="1">Avanti<small>W</small></button>
                    <span class="pad-spacer"></span>
                    <button data-axis="leftRight" data-direction="-1">Sinistra<small>A</small></button>
                    <button data-axis="forwardBack" data-direction="-1">Indietro<small>S</small></button>
                    <button data-axis="leftRight" data-direction="1">Destra<small>D</small></button>
                </div>
            </div>

            <div>
                <h2>Quota e rotazione</h2>

                <div class="button-row">
                    <button data-axis="upDown" data-direction="1">Su<small>R</small></button>
                    <button data-axis="upDown" data-direction="-1">Giù<small>F</small></button>
                </div>

                <div class="button-row">
                    <button data-axis="yaw" data-direction="-1">Ruota a sinistra<small>Q</small></button>
                    <button data-axis="yaw" data-direction="1">Ruota a destra<small>E</small></button>
                </div>
            </div>

            <label class="speed-control">Velocità
                <input type="range" id="speedSlider" min="10" max="60" step="5" value="30">
                <output id="speedValue">30</output>
            </label>

            <p class="help-text">Tieni premuto un pulsante (o un tasto) per muoverti, rilascia per fermarti. Barra spaziale: stop.</p>

            <button id="emergencyButton">Emergenza: spegni i motori</button>
        </section>
    </main>

    <script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
